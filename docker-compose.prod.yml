services:
  app:
    build:
      context: .
      dockerfile: docker/prod/php/Dockerfile
    image: ${APP_IMAGE:-asaba-hustle}:${APP_IMAGE_TAG:-latest}
    container_name: asaba-hustle-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    args:
      VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: asaba-hustle-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/prod/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
      - nuxus-prod

  queue:
    image: ${APP_IMAGE:-asaba-hustle}:${APP_IMAGE_TAG:-latest}
    container_name: asaba-hustle-queue
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_ROLE: queue
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - internal

  reverb:
    image: ${APP_IMAGE:-asaba-hustle}:${APP_IMAGE_TAG:-latest}
    container_name: asaba-hustle-reverb
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_ROLE: reverb
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - internal
      - nuxus-prod

  mysql:
    image: mysql:8.4
    container_name: asaba-hustle-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: asaba-hustle-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  migrate:
    image: ${APP_IMAGE:-asaba-hustle}:${APP_IMAGE_TAG:-latest}
    container_name: asaba-hustle-migrate
    profiles: ["maintenance"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    entrypoint: ["php", "artisan"]
    command: ["migrate", "--force", "--no-interaction"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - internal

  seed-production:
    image: ${APP_IMAGE:-asaba-hustle}:${APP_IMAGE_TAG:-latest}
    container_name: asaba-hustle-seed
    profiles: ["maintenance"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    entrypoint: ["php", "artisan"]
    command:
      ["db:seed", "--class=ProductionSeeder", "--force", "--no-interaction"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - internal

volumes:
  app_storage:
  mysql_data:
  redis_data:

networks:
  internal:
    driver: bridge

  nuxus-prod:
    external: true
    name: nuxus-commerce_nuxus-prod
